name: Setup Java and Maven
description: Installs Temurin JDK 21 with Maven dependency caching.
runs:
  using: composite
  steps:
    - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        distribution: temurin
        java-version: "21"
        cache: maven
