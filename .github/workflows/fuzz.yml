name: Fuzzing

on:
  workflow_call:
    inputs:
      duration:
        description: Fuzzing duration per target
        type: string
        default: 10m
  workflow_dispatch:
    inputs:
      duration:
        description: Fuzzing duration per target
        default: 10m

permissions: {}

jobs:
  fuzz:
    name: Property and fuzz tests (${{ github.event_name == 'pull_request' && 'regression' || 'fuzzing' }})
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet
      - name: Restore and build
        run: |
          dotnet restore HelloApi.slnx
          dotnet build HelloApi.slnx --no-restore -c Release
      - name: Run property and fuzz tests
        env:
          FUZZ_DURATION: ${{ inputs.duration || '5m' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Pull requests and pushes run each property test once; nightly and manual runs
          # repeat the suite until the time budget is spent.
          seconds=0
          case "$FUZZ_DURATION" in *m) seconds=$(( ${FUZZ_DURATION%m} * 60 )) ;; *s) seconds=${FUZZ_DURATION%s} ;; esac
          if [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "push" ]; then seconds=0; fi
          deadline=$((SECONDS + seconds))
          run=0
          while true; do
            run=$((run + 1))
            dotnet test HelloApi.slnx --no-build -c Release \
              --results-directory "fuzz-out/run-${run}" \
              --logger "trx;LogFileName=fuzz.trx"
            [ "$SECONDS" -lt "$deadline" ] || break
          done
      - name: Upload fuzz results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-results
          retention-days: 30
          if-no-files-found: warn
          path: fuzz-out

  summary:
    name: Fuzzing summary and gate
    needs: [fuzz]
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "fuzz-results"
          path: scan-results
      - name: Normalize, summarize and gate
        run: |
          python3 .github/scripts/security_report.py report --workflow fuzz \
            --input scan-results --baseline .security/baseline.json \
            --out findings-out/findings-fuzz.json --fail-on high
      - name: Upload normalized findings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: findings-fuzz
          retention-days: 30
          path: findings-out
