name: Pages

# Builds the documentation site from docs/ and .github/workflows/ with site/build.py and deploys it
# to GitHub Pages. Pull requests build and link-check only; main and manual runs also deploy.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - ".github/workflows/**"
      - ".github/scripts/**"
  pull_request:
    paths:
      - "site/**"
      - "docs/**"
      - ".github/workflows/**"
      - ".github/scripts/**"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and check site
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        id: pages
      - name: Install generator dependencies (exact versions, SHA-512 hashes)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --require-hashes --only-binary :all: -r site/requirements.txt
      - name: Build site
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: .venv/bin/python site/build.py --summary "$GITHUB_STEP_SUMMARY"
      - name: Check links and anchors
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress --include-fragments --exclude-path _site/404.html _site
          fail: true
          jobSummary: true
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    if: ${{ github.event_name != 'pull_request' }}
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
      - name: Verify the deployed site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          base="${PAGE_URL%/}"
          for path in "/" "/pipeline/" "/workflows/" "/agents/" "/release/" "/setup/" "/pipeline/visuals/pipeline-overview-fr.svg" "/pipeline/visuals/agentic-vs-legacy-fr.svg" "/pipeline/visuals/agentic-run-guardrails-fr.svg"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 5 --retry-all-errors "${base}${path}")
            echo "${code} ${base}${path}" | tee -a "$GITHUB_STEP_SUMMARY"
            [ "$code" = "200" ] || exit 1
          done
