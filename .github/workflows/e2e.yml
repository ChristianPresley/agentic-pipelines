name: E2E

# Hosted runners use Docker. Locally, run the same flow with WSLC (see scripts/e2e-local.ps1):
#   wslc build -t hello-api:e2e .
#   wslc run -d --name hello-api -p 8080:8080 hello-api:e2e
#   $env:E2E_BASE_URL='http://localhost:8080'; dotnet test --filter FullyQualifiedName~HelloApiE2ETests

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref (tag or SHA) to build and test.
        type: string
        default: ""
      version:
        description: Version stamped into the image (empty keeps the Dockerfile default).
        type: string
        default: ""
  workflow_dispatch:

permissions: {}

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  IMAGE_LOCAL: hello-api:e2e

jobs:
  e2e:
    name: End-to-end tests against the container image
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image under test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE_LOCAL }}
          build-args: |
            VERSION=${{ inputs.version || '1.0.0' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the container and wait for readiness
        run: |
          docker run -d --name hello-api --cap-drop ALL --security-opt no-new-privileges -p 8080:8080 "$IMAGE_LOCAL"
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health/readiness > /dev/null; then
              echo "Container is ready"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Container did not become ready"
          docker logs hello-api
          exit 1
      - name: Verify the container runs as a non-root user
        run: |
          uid=$(docker inspect --format '{{.Config.User}}' hello-api)
          echo "Container user: $uid"
          [ "${uid%%:*}" != "0" ] && [ -n "$uid" ] || { echo "::error::Container runs as root"; exit 1; }
      - name: Run the end-to-end suite
        env:
          E2E_BASE_URL: http://localhost:8080
        run: >
          dotnet test tests/HelloApi.Tests/HelloApi.Tests.csproj -c Release
          --filter "FullyQualifiedName~HelloApiE2ETests"
          --results-directory artifacts/e2e-results
          --logger "trx;LogFileName=e2e.trx"
      - name: E2E summary
        if: always()
        run: |
          python3 .github/scripts/build_summary.py artifacts
          {
            echo
            echo "### Image under test"
            echo
            docker image inspect "$IMAGE_LOCAL" --format '- Size: {{.Size}} bytes{{"\n"}}- Created: {{.Created}}'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Container logs
        if: failure()
        run: docker logs hello-api
      - name: Upload E2E reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-reports
          retention-days: 30
          if-no-files-found: warn
          path: artifacts/e2e-results
