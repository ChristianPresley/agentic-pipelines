name: Release

# Releases are managed by tags. Push a semver tag (vX.Y.Z or vX.Y.Z-rc.N) on a commit
# that is already on main, or run the "Cut release" workflow, which creates the tag.
#
# Pipeline: validate tag -> release gates -> build + integration tests -> E2E on the image
#           -> agent readiness review -> manual approval (production environment)
#           -> publish image / NuGet package / provenance -> GitHub Release.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  prepare:
    name: Validate tag
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [ "$REF_TYPE" = "tag" ] || { echo "::error::Run this workflow from a tag, not a branch"; exit 1; }
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not a semantic version (vX.Y.Z or vX.Y.Z-rc.N)"; exit 1
          fi
          version="${TAG#v}"
          prerelease=false; [[ "$version" == *-* ]] && prerelease=true
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $TAG ($GITHUB_SHA) is not on main"; exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::A GitHub Release for $TAG already exists"; exit 1
          fi
          {
            echo "tag=$TAG"; echo "version=$version"; echo "prerelease=$prerelease"; echo "sha=$GITHUB_SHA"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Release $TAG"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Version | \`$version\` |"
            echo "| Pre-release | $prerelease |"
            echo "| Commit | \`$GITHUB_SHA\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  gates:
    name: Release gates (scanners and open findings)
    needs: [prepare]
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      issues: read
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Require the Pipeline run for the tagged commit to have passed
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 2400))
          while true; do
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/pipeline.yml/runs?head_sha=$SHA&event=push&per_page=50" \
              --jq '.workflow_runs[] | [.name, .status, (.conclusion // "")] | @tsv' > runs.tsv
            passed=$(awk -F'\t' '$3=="success"' runs.tsv | wc -l)
            running=$(awk -F'\t' '$2!="completed"' runs.tsv | wc -l)
            seen=$(wc -l < runs.tsv)
            failed=0
            if [ "$passed" -gt 0 ]; then state="passed"; break
            elif [ "$running" -gt 0 ] || [ "$seen" -eq 0 ]; then state="waiting"
            else state="FAILED"; failed=1; break; fi
            [ "$SECONDS" -lt "$deadline" ] || { echo "::error::Timed out waiting for the Pipeline run"; failed=1; break; }
            sleep 30
          done
          { echo "### Pipeline gate for \`$SHA\`"; echo; echo "| Workflow | State |"; echo "|---|---|"; echo "| Pipeline | $state |"; } >> "$GITHUB_STEP_SUMMARY"
          [ "$failed" -eq 0 ] || { echo "::error::Release gate failed: the Pipeline run did not pass"; exit 1; }
      - name: Block on open critical or high security findings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          total=0
          for severity in critical high; do
            count=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label security-finding --limit 1000 --json labels,title \
              | jq --arg s "$severity" '[.[] | select(([.labels[].name] | index("severity:" + $s)) or (.title | startswith("[security] " + $s + " ")))] | length')
            echo "Open $severity findings: $count"
            total=$((total + count))
          done
          {
            echo "### Open security findings"
            echo
            echo "Critical or high issues open: **$total**"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$total" -eq 0 ] || { echo "::error::Release blocked by $total open critical/high security issue(s)"; exit 1; }

  build:
    name: Build, unit and integration tests
    needs: [prepare, gates]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet
      - name: Restore, build and test with coverage
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          dotnet restore HelloApi.slnx
          dotnet format HelloApi.slnx --no-restore --verify-no-changes
          dotnet build HelloApi.slnx --no-restore -c Release -warnaserror -p:Version="$VERSION"
          dotnet test HelloApi.slnx --no-build -c Release --collect:"XPlat Code Coverage" \
            --results-directory artifacts/test-results --logger "trx;LogFileName=tests.trx"
      - name: Build summary
        if: always()
        run: python3 .github/scripts/build_summary.py artifacts
      - name: Collect release artifacts
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          dotnet publish src/HelloApi/HelloApi.csproj --no-build -c Release -p:Version="$VERSION" -o artifacts/publish
          mkdir -p release
          (cd artifacts/publish && zip -qr "$GITHUB_WORKSPACE/release/hello-api-${VERSION}.zip" .)
          (cd release && sha512sum * > SHA512SUMS)
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: artifacts/publish
          format: cyclonedx-json
          output-file: release/hello-api-${{ needs.prepare.outputs.version }}.cdx.json
          upload-artifact: false
      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts
          retention-days: 90
          if-no-files-found: error
          path: release
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-build-reports
          retention-days: 30
          if-no-files-found: warn
          path: |
            artifacts/test-results
            artifacts/build-summary.json

  e2e:
    name: End-to-end tests
    needs: [prepare, gates]
    permissions:
      contents: read
    uses: ./.github/workflows/e2e.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      version: ${{ needs.prepare.outputs.version }}

  readiness:
    name: Agent release readiness review
    needs: [prepare, build, e2e]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch the release-readiness agent
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh workflow run release-readiness.lock.yml --repo "$GITHUB_REPOSITORY" --ref main -f "tag=$TAG"
          {
            echo "## Agent readiness review requested"
            echo
            echo "The release-readiness agent posts a go/no-go issue for \`$TAG\` while this run waits for approval."
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish image and release archive (requires approval)
    needs: [prepare, build, e2e, readiness]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment:
      name: production
      url: https://github.com/${{ github.repository }}/releases/tag/${{ needs.prepare.outputs.tag }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: release
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.prepare.outputs.tag }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.prerelease == 'false' }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
      - name: Sign image (Cosign keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY,,}@${DIGEST}"
      - name: Attest image build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Attest release archive build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/hello-api-${{ needs.prepare.outputs.version }}.zip
      - name: Attest release archive SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: release/hello-api-${{ needs.prepare.outputs.version }}.zip
          sbom-path: release/hello-api-${{ needs.prepare.outputs.version }}.cdx.json
      - name: Publish summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          fence=$'\x60\x60\x60'
          {
            echo "## Published artifacts"
            echo
            echo "- Image: \`${image}@${DIGEST}\`"
            echo "- Image tags:"
            while read -r t; do echo "  - \`$t\`"; done <<< "$TAGS"
            echo "- Release archive: \`hello-api-${VERSION}.zip\` (framework-dependent publish output, SHA512SUMS, CycloneDX SBOM)"
            echo "- Cosign signature, SLSA provenance and SBOM attestations attached"
            echo
            echo "Verify the image:"
            echo
            echo "${fence}sh"
            echo "cosign verify ${image}@${DIGEST} --certificate-identity-regexp 'https://github.com/${GITHUB_REPOSITORY}/' --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo "gh attestation verify oci://${image}@${DIGEST} --repo ${GITHUB_REPOSITORY}"
            echo "${fence}"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Create GitHub Release
    needs: [prepare, publish]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: release
      - name: Create the release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          set -euo pipefail
          flags=()
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease) || flags+=(--latest)
          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes "${flags[@]}"
          {
            echo "## Release created"
            echo
            echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
            echo
            echo "The release-notes agent will refine the notes after this run completes."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Dispatch the release-notes agent
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh workflow run release-notes.lock.yml --repo "$GITHUB_REPOSITORY" --ref main -f "tag=$TAG"
