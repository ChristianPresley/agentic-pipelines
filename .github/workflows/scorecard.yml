name: OpenSSF Scorecard

on:
  schedule:
    - cron: "27 3 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecard:
    name: Scorecard analysis
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      id-token: write
      actions: read
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create the results directory
        run: mkdir -p scorecard-out
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: scorecard-out/scorecard.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: scorecard-out/scorecard.sarif
          category: scorecard
      - name: Summarize
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          data = json.load(open("scorecard-out/scorecard.sarif"))
          results = data["runs"][0].get("results", [])
          print("## OpenSSF Scorecard\n")
          print(f"{len(results)} check(s) reported an issue.\n")
          print("| Check | Level | Message |\n| --- | --- | --- |")
          for r in results[:25]:
              print(f"| {r.get('ruleId')} | {r.get('level')} | {r['message']['text'].splitlines()[0][:120]} |")
          PY
      - name: Upload SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          retention-days: 30
          path: scorecard-out
