name: OpenSSF Scorecard

on:
  schedule:
    - cron: "27 3 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecard:
    name: Scorecard analysis
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      id-token: write
      actions: read
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create the results directory
        run: mkdir -p scorecard-out
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard-out/scorecard.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: scorecard-out/scorecard.sarif
          category: scorecard
      - name: Summarize
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          data = json.load(open("scorecard-out/scorecard.sarif"))
          results = data["runs"][0].get("results", [])
          print("## OpenSSF Scorecard\n")
          print(f"{len(results)} check(s) reported an issue.\n")
          print("| Check | Level | Message |\n| --- | --- | --- |")
          for r in results[:25]:
              print(f"| {r.get('ruleId')} | {r.get('level')} | {r['message']['text'].splitlines()[0][:120]} |")
          PY
      - name: Upload SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          retention-days: 30
          path: scorecard-out
