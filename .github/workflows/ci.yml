name: CI

on:
  workflow_call:
    inputs:
      full:
        description: Also run mutation testing and the dependency freshness report.
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      full:
        description: Also run mutation testing and the dependency freshness report.
        type: boolean
        default: true

permissions: {}

env:
  MAVEN_ARGS: -B -ntp

jobs:
  build:
    name: Build, test and quality gates
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-java
      - name: Verify (unit, property, fuzz regression, integration, JaCoCo, Checkstyle, PMD, SpotBugs)
        run: ./mvnw verify
      - name: Build summary
        if: always()
        run: python3 .github/scripts/build_summary.py target
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-reports
          retention-days: 30
          if-no-files-found: warn
          path: |
            target/surefire-reports
            target/failsafe-reports
            target/site/jacoco
            target/build-summary.json
            target/checkstyle-result.xml
            target/pmd.xml
            target/spotbugsXml.xml
            target/spotbugsSarif.json
            target/*.jar

  mutation:
    name: Mutation testing (PIT)
    if: ${{ inputs.full }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-java
      - name: Run PIT
        run: ./mvnw test-compile org.pitest:pitest-maven:mutationCoverage -Pmutation -Dcheckstyle.skip -Dpmd.skip -Dspotbugs.skip
      - name: Build summary
        if: always()
        run: python3 .github/scripts/build_summary.py target
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-reports
          retention-days: 30
          if-no-files-found: warn
          path: target/pit-reports

  dependency-updates:
    name: Dependency freshness report
    if: ${{ inputs.full }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-java
      - name: Report available updates
        run: |
          ./mvnw versions:display-dependency-updates versions:display-plugin-updates | tee updates.txt
          {
            echo "## Dependency freshness"
            echo
            echo '```'
            grep -E '^\[INFO\]   ' updates.txt | head -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  scripts:
    name: Helper script tests
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s .github/scripts -v
