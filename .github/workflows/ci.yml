name: CI

on:
  workflow_call:
    inputs:
      full:
        description: Also run mutation testing and the dependency freshness report.
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      full:
        description: Also run mutation testing and the dependency freshness report.
        type: boolean
        default: true

permissions: {}

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  STRYKER_VERSION: "5.1.0"

jobs:
  build:
    name: Build, test and quality gates
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet
      - name: Restore
        run: dotnet restore HelloApi.slnx
      - name: Check formatting and analyzers
        run: dotnet format HelloApi.slnx --no-restore --verify-no-changes
      - name: Build (Roslyn analyzers, warnings as errors)
        run: dotnet build HelloApi.slnx --no-restore -c Release -warnaserror
      - name: Test (unit, property, fuzz regression, coverage)
        run: >
          dotnet test HelloApi.slnx --no-build -c Release
          --collect:"XPlat Code Coverage"
          --results-directory artifacts/test-results
          --logger "trx;LogFileName=tests.trx"
      - name: Publish
        run: dotnet publish src/HelloApi/HelloApi.csproj --no-build -c Release -o artifacts/publish
      - name: Build summary
        if: always()
        run: python3 .github/scripts/build_summary.py artifacts
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-reports
          retention-days: 30
          if-no-files-found: warn
          path: |
            artifacts/test-results
            artifacts/build-summary.json
            artifacts/publish

  mutation:
    name: Mutation testing (Stryker.NET)
    if: ${{ inputs.full }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet
      - name: Install Stryker.NET
        run: dotnet tool install dotnet-stryker --version "$STRYKER_VERSION" --tool-path .tools
      - name: Run Stryker.NET
        run: |
          cd tests/HelloApi.Tests
          "$GITHUB_WORKSPACE/.tools/dotnet-stryker" --project HelloApi.csproj \
            --reporter json --reporter html --output "$GITHUB_WORKSPACE/artifacts/stryker"
      - name: Build summary
        if: always()
        run: python3 .github/scripts/build_summary.py artifacts
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-reports
          retention-days: 30
          if-no-files-found: warn
          path: artifacts/stryker
  dependency-updates:
    name: Dependency freshness report
    if: ${{ inputs.full }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet
      - name: Report available updates
        run: |
          dotnet restore HelloApi.slnx
          dotnet list HelloApi.slnx package --outdated --include-transitive | tee updates.txt
          {
            echo "## Dependency freshness"
            echo
            echo '```'
            grep -E '^   > ' updates.txt | head -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
  scripts:
    name: Helper script tests
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s .github/scripts -v
