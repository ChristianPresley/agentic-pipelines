name: DAST

on:
  workflow_call:
  workflow_dispatch:

permissions: {}

env:
  SCHEMATHESIS_VERSION: "4.33.0"

jobs:
  zap:
    name: OWASP ZAP API scan
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the container image
        run: docker build -t hello-api:dast .
      - name: Start application
        run: |
          docker run -d --name hello-api -p 8080:8080 hello-api:dast
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:8080/actuator/health/readiness && exit 0
            sleep 2
          done
          docker logs hello-api
          exit 1
      - name: ZAP API scan
        uses: zaproxy/action-api-scan@5158fe4d9d8fcc75ea204db81317cce7f9e5453d # v0.10.0
        with:
          target: http://localhost:8080/v3/api-docs
          format: openapi
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-action-report
          cmd_options: -a -j
      - name: Collect ZAP reports
        if: always()
        run: |
          mkdir -p zap-out
          sudo chmod -R a+r . || true
          cp -f report_json.json report_md.md report_html.html zap-out/ 2>/dev/null || true
          ls -la zap-out
      - name: Application log
        if: always()
        run: docker logs hello-api > zap-out/app.log 2>&1 || true
      - name: Upload ZAP results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-results
          retention-days: 30
          if-no-files-found: warn
          path: zap-out

  schemathesis:
    name: Schemathesis API fuzzing
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Build the container image
        run: docker build -t hello-api:dast .
      - name: Start application
        run: |
          docker run -d --name hello-api -p 8080:8080 hello-api:dast
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:8080/actuator/health/readiness && exit 0
            sleep 2
          done
          docker logs hello-api
          exit 1
      - name: Install Schemathesis
        run: pip install --disable-pip-version-check "schemathesis==${SCHEMATHESIS_VERSION}"
      - name: Run Schemathesis
        run: |
          mkdir -p schemathesis-out
          schemathesis run http://localhost:8080/v3/api-docs \
            --checks all --max-examples 200 \
            --report junit --report-dir schemathesis-out \
            --report-junit-path schemathesis-out/schemathesis-junit.xml || true
      - name: Upload Schemathesis results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: schemathesis-results
          retention-days: 30
          if-no-files-found: warn
          path: schemathesis-out

  summary:
    name: DAST summary and gate
    needs: [zap, schemathesis]
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{zap,schemathesis}-results"
          path: scan-results
      - name: Normalize, summarize and gate
        run: |
          python3 .github/scripts/security_report.py report --workflow dast \
            --input scan-results --baseline .security/baseline.json \
            --out findings-out/findings-dast.json --fail-on high
      - name: Upload normalized findings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: findings-dast
          retention-days: 30
          path: findings-out
