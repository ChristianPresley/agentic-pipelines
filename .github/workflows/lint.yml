name: Workflow lint

on:
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install and run actionlint (checksum verified)
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -fsSL -o actionlint.tgz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tgz" | sha256sum --check --strict
          tar -xzf actionlint.tgz actionlint
          ./actionlint -color

  zizmor:
    name: zizmor
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: ${{ !github.event.pull_request.head.repo.fork }}

  gh-aw-lock-drift:
    name: gh-aw lock file drift
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install gh-aw
        env:
          GH_TOKEN: ${{ github.token }}
          GH_AW_VERSION: v1.2.1
        run: gh extension install github/gh-aw --pin "$GH_AW_VERSION"
      - name: Recompile and check for drift
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh aw compile
          git diff --exit-code -- .github/workflows '*.lock.yml' || {
            echo "::error::Lock files are stale. Run 'gh aw compile' and commit the result."
            exit 1
          }

  governance-toolkit:
    name: governance toolkit tests and inspection report
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install OPA and the Python dependency (hash verified)
        env:
          OPA_VERSION: 1.22.3
          OPA_SHA512: abe19b5abdf950f2fba2cbc2b889fbd598469807f4524830750a86d444e7d210519daad3d724d772bbbc489abf21da7c13e276ebd39ecd8eae3f1e1a422764a5
        run: |
          set -euo pipefail
          curl -fsSL -o opa "https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/opa_linux_amd64_static"
          echo "${OPA_SHA512}  opa" | sha512sum --check --strict
          chmod +x opa
          python3 -m venv .venv
          .venv/bin/pip install --quiet --require-hashes --only-binary :all: -r scripts/governance/requirements.txt
      - name: Policy unit tests
        run: ./opa test policy/rego
      - name: Toolkit tests
        env:
          OPA: ${{ github.workspace }}/opa
        run: .venv/bin/python -m unittest discover -s scripts/tests -v
      - name: Inspection report matches the lock files
        run: .venv/bin/python scripts/explain-agentic-workflow.py --all --out docs/governance/agent-inspection-reports.md --check
