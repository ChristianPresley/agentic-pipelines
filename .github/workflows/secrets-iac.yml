name: Secrets and IaC

on:
  workflow_call:
  workflow_dispatch:

permissions: {}

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Gitleaks (checksum verified)
        run: |
          curl -fsSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum --check --strict
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan history
        run: |
          mkdir -p gitleaks-out
          ./gitleaks detect --source . --redact --exit-code 0 --report-format sarif --report-path gitleaks-out/gitleaks.sarif
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: ${{ !github.event.pull_request.head.repo.fork && hashFiles('gitleaks-out/gitleaks.sarif') != '' }}
        with:
          sarif_file: gitleaks-out/gitleaks.sarif
          category: gitleaks
      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-results
          retention-days: 30
          if-no-files-found: warn
          path: gitleaks-out

  hadolint:
    name: Hadolint (Dockerfile)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          format: sarif
          output-file: hadolint-out/hadolint.sarif
          no-fail: true
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: ${{ !github.event.pull_request.head.repo.fork && hashFiles('hadolint-out/hadolint.sarif') != '' }}
        with:
          sarif_file: hadolint-out/hadolint.sarif
          category: hadolint
      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hadolint-results
          retention-days: 30
          if-no-files-found: warn
          path: hadolint-out

  summary:
    name: Secrets and IaC summary and gate
    needs: [gitleaks, hadolint]
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{gitleaks,hadolint}-results"
          path: scan-results
      - name: Normalize, summarize and gate
        run: |
          python3 .github/scripts/security_report.py report --workflow secrets-iac \
            --input scan-results --baseline .security/baseline.json \
            --out findings-out/findings-secrets-iac.json --fail-on high
      - name: Upload normalized findings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: findings-secrets-iac
          retention-days: 30
          path: findings-out
