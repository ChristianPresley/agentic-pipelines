<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" lang="en" width="1600" height="1226" viewBox="0 0 1600 1226" role="img" aria-labelledby="title description">
  <title id="title">Beyond pass/fail: what agents add</title>
  <desc id="description">Side-by-side comparison of a legacy deterministic pipeline and the GitHub Agentic Workflows in this repository, in eight areas: failed runs, duplicate findings, explaining findings, fixing, release decision, reporting, release notes, and limits and safety. A legacy pipeline stops at pass or fail and a person does the follow-up. The agents read the evidence, group and explain it, and create issues, comments, discussions or pull requests within declared limits. Scanners, tests, release gates and the production approval stay deterministic, and people decide.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1L7 4L1 7" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <symbol id="i-approval" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="6" r="4"/><path d="M2 22V19Q2 13 9 13Q13 13 15 16M15 20L18 23L23 16"/></g></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M7 12L11 16L17 9"/></g></symbol>
    <symbol id="i-cross" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 8.5L15.5 15.5M15.5 8.5L8.5 15.5"/></g></symbol>
    <symbol id="i-dedupe" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="12" height="12" rx="2"/><path d="M9 21H19Q21 21 21 19V9"/></g></symbol>
    <symbol id="i-flask" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H16M10 3V10L4 19Q3 21 6 21H18Q21 21 20 19L14 10V3M7 15H17"/></g></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7Q8 3 12 3Q16 3 16 7V10M12 14V17"/></g></symbol>
    <symbol id="i-report" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2H15L20 7V22H5ZM15 2V7H20M8 11H17M8 15H17M8 19H13"/></g></symbol>
    <symbol id="i-script" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="M6 10L9.5 13L6 16M12 16H18"/></g></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="7"/><path d="M15.5 15.5L21 21"/></g></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L21 6V12Q21 18 12 22Q3 18 3 12V6Z"/><path d="M7 12L11 16L17 9"/></g></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L14.6 9.4L22 12L14.6 14.6L12 22L9.4 14.6L2 12L9.4 9.4Z"/></g></symbol>
    <symbol id="i-tag" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3H13L22 12L12 22L3 13Z"/><circle cx="8" cy="8" r="1.5"/></g></symbol>
    <symbol id="i-wrench" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20L14 10M13 3L18 3L22 7L22 12L17 12L12 7Z"/><path d="M3 16L8 21"/></g></symbol>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; }
      .heading { font-size: 24px; font-weight: 700; fill: #0f172a; }
      .label { font-size: 19px; font-weight: 650; fill: #0f172a; }
      .name { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .copy { font-size: 16px; fill: #475569; }
      .small { font-size: 14px; fill: #475569; }
      .cell { font-size: 15px; fill: #334155; }
      .cellb { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .th { font-size: 13px; font-weight: 700; letter-spacing: 1px; fill: #475569; }
      .chip { font-size: 13px; font-weight: 700; letter-spacing: 1px; }
      .badge { font-size: 12px; font-weight: 700; letter-spacing: 1px; }
      .number { font-size: 13px; font-weight: 700; fill: #64748b; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .connector { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .secondary { stroke-dasharray: 5 5; }
    </style>
  </defs>

  <rect width="1600" height="1226" rx="24" fill="#f1f5f9"/>
  <path d="M24 0H1576Q1600 0 1600 24V150H0V24Q0 0 24 0" fill="#0f172a"/>
  <text x="48" y="35" fill="#93c5fd" font-size="12" font-weight="700" letter-spacing="2">WHY AGENTS  ·  LEGACY PIPELINE VS AGENTIC WORKFLOW</text>
  <text x="48" y="80" fill="#ffffff" font-size="36" font-weight="700">Beyond pass/fail: what agents add</text>
  <text x="48" y="115" fill="#cbd5e1" font-size="18">The same events and the same scanners. The difference is what happens after a result arrives.</text>
  <g transform="translate(1432 44)" fill="none" stroke="#60a5fa" stroke-width="2"><rect x="0" y="12" width="26" height="26" rx="7"/><rect x="50" y="0" width="26" height="26" rx="7"/><rect x="50" y="46" width="26" height="26" rx="7"/><path d="M26 25H38V13H50M38 25V59H50"/></g>
  <g transform="translate(1530 44)" fill="none" stroke="#e879f9" stroke-width="2" stroke-linejoin="round"><path d="M16 0L20 12L32 16L20 20L16 32L12 20L0 16L12 12Z" transform="translate(0 20)"/></g>
  <rect x="304" y="176" width="600" height="70" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
  <use href="#i-script" x="322" y="197" width="28" height="28" color="#475569"/>
  <text x="366" y="206" class="th" fill="#334155">LEGACY DETERMINISTIC PIPELINE</text>
  <text x="366" y="229" class="small">Fixed steps, same path every run</text>
  <rect x="920" y="176" width="632" height="70" rx="14" fill="#fdf4ff" stroke="#e879f9" stroke-width="2" />
  <use href="#i-spark" x="938" y="197" width="28" height="28" color="#86198f"/>
  <text x="982" y="206" class="th" fill="#86198f">GITHUB AGENTIC WORKFLOW</text>
  <text x="982" y="229" class="small">An agent reasons over evidence, within limits</text>
  <circle cx="912" cy="211" r="22" fill="#0f172a"/><text x="912" y="217" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">VS</text>
  <rect x="48" y="260" width="240" height="88" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <circle cx="82" cy="304" r="19" fill="#f1f5f9" stroke="#cbd5e1"/>
  <use href="#i-cross" x="72" y="294" width="20" height="20" color="#0f172a"/>
  <text x="114" y="310" class="name">Failed run</text>
  <rect x="304" y="260" width="600" height="88" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <path d="M320 295h14M320 305h14" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <text x="354" y="309.0" class="cell">The step exits non-zero. A person opens the logs and works out why.</text>
  <rect x="920" y="260" width="632" height="88" rx="14" fill="#fdf4ff" stroke="#e879f9" stroke-width="1.5" />
  <use href="#i-spark" x="934" y="294" width="20" height="20" color="#86198f"/>
  <text x="970" y="299.5" class="cell">The failure analyst reads the failed jobs, names a root-cause class and opens one</text>
  <text x="970" y="318.5" class="cell">issue with evidence and a suggested fix.</text>
  <path d="M908 304H916" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="48" y="358" width="240" height="88" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <circle cx="82" cy="402" r="19" fill="#f1f5f9" stroke="#cbd5e1"/>
  <use href="#i-dedupe" x="72" y="392" width="20" height="20" color="#0f172a"/>
  <text x="114" y="398" class="name">Duplicate</text>
  <text x="114" y="418" class="name">findings</text>
  <rect x="304" y="358" width="600" height="88" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <path d="M320 393h14M320 403h14" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <text x="354" y="407.0" class="cell">Each run reports again unless dedupe logic is written by hand.</text>
  <rect x="920" y="358" width="632" height="88" rx="14" fill="#fdf4ff" stroke="#e879f9" stroke-width="1.5" />
  <use href="#i-spark" x="934" y="392" width="20" height="20" color="#86198f"/>
  <text x="970" y="397.5" class="cell">Triage groups findings by rule or CVE and skips any that already have an issue. At</text>
  <text x="970" y="416.5" class="cell">most 10 new issues per run.</text>
  <path d="M908 402H916" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="48" y="456" width="240" height="88" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <circle cx="82" cy="500" r="19" fill="#f1f5f9" stroke="#cbd5e1"/>
  <use href="#i-search" x="72" y="490" width="20" height="20" color="#0f172a"/>
  <text x="114" y="496" class="name">Explaining a</text>
  <text x="114" y="516" class="name">finding</text>
  <rect x="304" y="456" width="600" height="88" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <path d="M320 491h14M320 501h14" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <text x="354" y="505.0" class="cell">A rule ID, a file and a line from the scanner.</text>
  <rect x="920" y="456" width="632" height="88" rx="14" fill="#fdf4ff" stroke="#e879f9" stroke-width="1.5" />
  <use href="#i-spark" x="934" y="490" width="20" height="20" color="#86198f"/>
  <text x="970" y="505.0" class="cell">The issue states the impact, lists affected locations and gives remediation steps.</text>
  <path d="M908 500H916" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="48" y="554" width="240" height="88" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <circle cx="82" cy="598" r="19" fill="#f1f5f9" stroke="#cbd5e1"/>
  <use href="#i-wrench" x="72" y="588" width="20" height="20" color="#0f172a"/>
  <text x="114" y="604" class="name">Fixing</text>
  <rect x="304" y="554" width="600" height="88" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <path d="M320 589h14M320 599h14" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <text x="354" y="603.0" class="cell">A person writes the fix, tests it and opens the pull request.</text>
  <rect x="920" y="554" width="632" height="88" rx="14" fill="#fdf4ff" stroke="#e879f9" stroke-width="1.5" />
  <use href="#i-spark" x="934" y="588" width="20" height="20" color="#86198f"/>
  <text x="970" y="593.5" class="cell">A person starts the remediation agent. It makes the smallest fix and a test, runs</text>
  <text x="970" y="612.5" class="cell">dotnet test and opens one pull request.</text>
  <path d="M908 598H916" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="48" y="652" width="240" height="88" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <circle cx="82" cy="696" r="19" fill="#f1f5f9" stroke="#cbd5e1"/>
  <use href="#i-check" x="72" y="686" width="20" height="20" color="#0f172a"/>
  <text x="114" y="702" class="name">Release decision</text>
  <rect x="304" y="652" width="600" height="88" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <path d="M320 687h14M320 697h14" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <text x="354" y="701.0" class="cell">The gate passes or fails. The approver collects the evidence by hand.</text>
  <rect x="920" y="652" width="632" height="88" rx="14" fill="#fdf4ff" stroke="#e879f9" stroke-width="1.5" />
  <use href="#i-spark" x="934" y="686" width="20" height="20" color="#86198f"/>
  <text x="970" y="691.5" class="cell">The readiness agent turns gates, changes and open findings into a GO or NO-GO</text>
  <text x="970" y="710.5" class="cell">issue. A person still approves production.</text>
  <path d="M908 696H916" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="48" y="750" width="240" height="88" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <circle cx="82" cy="794" r="19" fill="#f1f5f9" stroke="#cbd5e1"/>
  <use href="#i-report" x="72" y="784" width="20" height="20" color="#0f172a"/>
  <text x="114" y="800" class="name">Reporting</text>
  <rect x="304" y="750" width="600" height="88" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <path d="M320 785h14M320 795h14" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <text x="354" y="799.0" class="cell">A pass or fail status for each run.</text>
  <rect x="920" y="750" width="632" height="88" rx="14" fill="#fdf4ff" stroke="#e879f9" stroke-width="1.5" />
  <use href="#i-spark" x="934" y="784" width="20" height="20" color="#86198f"/>
  <text x="970" y="789.5" class="cell">A daily discussion: findings by severity, scanner health, trend against yesterday,</text>
  <text x="970" y="808.5" class="cell">top 5 actions.</text>
  <path d="M908 794H916" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="48" y="848" width="240" height="88" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <circle cx="82" cy="892" r="19" fill="#f1f5f9" stroke="#cbd5e1"/>
  <use href="#i-tag" x="72" y="882" width="20" height="20" color="#0f172a"/>
  <text x="114" y="898" class="name">Release notes</text>
  <rect x="304" y="848" width="600" height="88" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <path d="M320 883h14M320 893h14" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <text x="354" y="897.0" class="cell">A generated changelog that lists merged pull requests.</text>
  <rect x="920" y="848" width="632" height="88" rx="14" fill="#fdf4ff" stroke="#e879f9" stroke-width="1.5" />
  <use href="#i-spark" x="934" y="882" width="20" height="20" color="#86198f"/>
  <text x="970" y="887.5" class="cell">Highlights, security fixes, upgrade notes and verify commands are added above</text>
  <text x="970" y="906.5" class="cell">the generated changelog.</text>
  <path d="M908 892H916" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="48" y="946" width="240" height="88" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <circle cx="82" cy="990" r="19" fill="#f1f5f9" stroke="#cbd5e1"/>
  <use href="#i-lock" x="72" y="980" width="20" height="20" color="#0f172a"/>
  <text x="114" y="996" class="name">Limits and safety</text>
  <rect x="304" y="946" width="600" height="88" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <path d="M320 981h14M320 991h14" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <text x="354" y="995.0" class="cell">Fixed permissions in YAML. The same behaviour every run.</text>
  <rect x="920" y="946" width="632" height="88" rx="14" fill="#fdf4ff" stroke="#e879f9" stroke-width="1.5" />
  <use href="#i-spark" x="934" y="980" width="20" height="20" color="#86198f"/>
  <text x="970" y="985.5" class="cell">Read-only agent job. Writes only through declared outputs with maximums and</text>
  <text x="970" y="1004.5" class="cell">expiry. Untrusted text is data. Network allow-list.</text>
  <path d="M908 990H916" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="48" y="1050" width="1504" height="118" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
  <text x="68" y="1080" class="heading">What stays deterministic here</text>
  <use href="#i-flask" x="68.0" y="1100" width="26" height="26" color="#0f172a"/>
  <text x="104.0" y="1120" class="name">Scanners and tests</text>
  <text x="104.0" y="1142" class="small">They produce the findings the agents read.</text>
  <use href="#i-shield" x="444.0" y="1100" width="26" height="26" color="#0f172a"/>
  <text x="480.0" y="1120" class="name">Release gates</text>
  <text x="480.0" y="1142" class="small">The gates job blocks on open critical or high</text>
  <text x="480.0" y="1160" class="small">findings.</text>
  <use href="#i-approval" x="820.0" y="1100" width="26" height="26" color="#0f172a"/>
  <text x="856.0" y="1120" class="name">Production approval</text>
  <text x="856.0" y="1142" class="small">A person approves the production</text>
  <text x="856.0" y="1160" class="small">environment.</text>
  <use href="#i-script" x="1196.0" y="1100" width="26" height="26" color="#0f172a"/>
  <text x="1232.0" y="1120" class="name">Compiled workflows</text>
  <text x="1232.0" y="1142" class="small">Lock files are compiled from the Markdown</text>
  <text x="1232.0" y="1160" class="small">source.</text>
  <text x="48" y="1198" class="small">Agents advise and prepare. Gates and people decide. Source: .github/workflows/*.md and release.yml. Design view, not live results.</text>
  <!-- end -->
</svg>
